version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finhealth_db
    environment:
      POSTGRES_USER: idbi_admin
      POSTGRES_PASSWORD: hackathon_win
      POSTGRES_DB: financial_health
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finhealth_cache
    ports:
      - "6379:6379"

volumes:
  postgres_data:
